# After-hours auto-reply settings
# Edit this file in TextEdit. Changes apply on the next run (within a minute).

# 1 = TEST MODE: writes what it WOULD send to logs/replies.log and sends nothing.
# 0 = LIVE: really sends the auto-replies.
DRY_RUN=1

# Business hours, 24-hour clock, in this Mac's time zone. Leave "" for closed all day.
HOURS_MON="09:00-18:00"
HOURS_TUE="09:00-18:00"
HOURS_WED="09:00-18:00"
HOURS_THU="09:00-18:00"
HOURS_FRI="09:00-18:00"
HOURS_SAT="10:00-16:00"
HOURS_SUN=""

# How your hours read in the text message.
HOURS_TEXT="Mon–Fri 9 AM–6 PM, Sat 10 AM–4 PM (closed Sunday)"

CALL_MESSAGE="Thanks for calling! I'm currently outside business hours. My hours are $HOURS_TEXT. I'll get back to you during business hours."
TEXT_MESSAGE="Thanks for your message! I'm currently outside business hours. My hours are $HOURS_TEXT. I'll get back to you during business hours."

# Only look at calls and texts from the last this-many minutes.
LOOKBACK_MINUTES=30

# Don't auto-reply if you texted that person yourself in the last this-many minutes.
RECENT_TEXT_MINUTES=30

# How far back the test command looks.
TEST_HOURS=24

# Added to 10-digit numbers that have no country code (1 = US/Canada).
DEFAULT_COUNTRY_CODE=1

# How long to watch for a delivery failure before trusting a send.
SEND_CHECK_SECONDS=20
